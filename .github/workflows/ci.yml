name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command:
          - format:check
          - lint
          - typecheck
          - build
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm --filter @webhook-center/api prisma:generate
      - name: Run ${{ matrix.command }}
        run: pnpm ${{ matrix.command }}

  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 3000
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://webhook:webhook_test_password@localhost:5432/webhook_test?schema=public
      PUBLIC_BASE_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: webhook_test
          POSTGRES_USER: webhook
          POSTGRES_PASSWORD: webhook_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webhook -d webhook_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm --filter @webhook-center/api prisma:generate
      - name: Apply database migrations
        run: pnpm --filter @webhook-center/api prisma:migrate:deploy
      - name: Run integration tests
        run: pnpm --filter @webhook-center/api test
